{% extends 'base.html' %}{% block title %}{{ t.sign_in }}{% endblock %}{% block content %}<section class="login-page"><div class="login-art"><span class="brand-mark"><i class="icon-droplets"></i></span><h1>{{ t.brand }}</h1><p>{{ t.brand_tagline }}</p></div><form class="panel login-form" method="post"><p class="eyebrow">{{ t.admin }}</p><h2>{{ t.login_title }}</h2><p>{{ t.login_copy }}</p><label>{{ t.email }}<input type="email" name="email" required></label><label>{{ t.password }}<input type="password" name="password" required></label><button class="button primary" type="submit">{{ t.sign_in_button }} <i class="icon-arrow-right"></i></button><small class="demo-hint">{{ t.demo_access }}</small></form></section>{% endblock %}
