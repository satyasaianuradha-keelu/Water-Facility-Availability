{% extends 'base.html' %}{% block title %}{{ t.report_problem }}{% endblock %}{% block content %}<section class="page-heading"><div class="shell"><p class="eyebrow">{{ t.community_survey }}</p><h1>{{ t.report_title }}</h1><p>{{ t.report_copy }}</p></div></section><section class="shell form-layout"><form class="panel report-form" method="post" enctype="multipart/form-data"><div class="form-grid"><label>{{ t.name }} <em>({{ t.optional }})</em><input name="name" value="{{ form.get('name','') }}" placeholder="{{ t.name_placeholder }}"></label><label>{{ t.area_village }} <b>*</b><select name="location" required><option value="">{{ t.choose_area }}</option>{% for area in report_areas %}<option value="{{ area }}" {{ 'selected' if form.get('location') == area }}>{{ area_labels.get(area, area) }}</option>{% endfor %}</select></label><label>{{ t.category }} <b>*</b><select name="category" required><option value="">{{ t.choose_category }}</option>{% for key in ['water_not_available','facility_not_working','broken_tap','supply_interruption','tank_issue','other'] %}<option value="{{ t[key] }}">{{ t[key] }}</option>{% endfor %}</select></label><label>{{ t.date }} <b>*</b><input type="date" name="date" value="{{ form.get('date', '') or '' }}" required></label></div><label class="description-label">{{ t.description }} <b>*</b><div class="voice-field"><textarea id="description" name="description" rows="6" required placeholder="{{ t.description_placeholder }}">{{ form.get('description','') }}</textarea><button type="button" class="voice-button" id="voiceButton" title="{{ t.voice_start }}"><i class="icon-mic"></i><span>{{ t.voice_start }}</span></button></div><span class="voice-status" id="voiceStatus">{{ t.voice_ready }}</span></label><label>{{ t.photo }} <em>({{ t.optional }})</em><input type="file" name="image" accept=".jpg,.jpeg,.png,.webp"><small class="help-text">{{ t.photo_help }}</small></label><button class="button primary submit-button" type="submit"><i class="icon-send"></i>{{ t.submit_report }}</button></form><aside class="side-note"><span class="note-icon"><i class="icon-heart-handshake"></i></span><h2>{{ t.report_cta }}</h2><p>{{ t.report_copy }}</p><a href="{{ url_for('track_report') }}" class="text-link">{{ t.track_report }} <i class="icon-arrow-up-right"></i></a></aside></section>{% endblock %}
